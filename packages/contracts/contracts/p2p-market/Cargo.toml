[package]
name = "p2p-market"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"
description = "P2PMarket: peer-to-peer trades of a Stellar asset against an off-chain local-money transfer"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
