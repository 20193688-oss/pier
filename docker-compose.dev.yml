# Postgres for `npm run dev:stack` when a Docker daemon is running. Without
# Docker, dev:stack starts an embedded Postgres from npm instead (same port, DEV_STACK_PG_PORT, default 54339).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: midpoint
      POSTGRES_PASSWORD: midpoint
      POSTGRES_DB: midpoint
    ports:
      - '127.0.0.1:${DEV_STACK_PG_PORT:-54339}:5432'
    volumes:
      - midpoint-dev-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U midpoint']
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  midpoint-dev-pg:
